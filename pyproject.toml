[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-estimation"
version = "0.1.0"
description = "Reproducible experiments in state estimation and sensor fusion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0,<3",
    "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
dataflash = ["pymavlink==2.4.49"]

[project.scripts]
meridian-gyro-drift = "meridian.gyro_drift:main"
meridian-linear-kalman = "meridian.kalman_experiment:main"
meridian-accel-fusion = "meridian.accel_experiment:main"
meridian-ekf-comparison = "meridian.ekf_experiment:main"
meridian-controlled-scenarios = "meridian.stress_experiment:main"
meridian-dataflash-audit = "meridian.dataflash_audit:main"
meridian-imu-replay = "meridian.imu_replay:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
