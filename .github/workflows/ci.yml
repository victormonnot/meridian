name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-cpp:
    name: Python and C++
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dataflash.lock
            pyproject.toml

      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y g++ cmake libeigen3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements-dataflash.lock -e '.[dataflash]'
          python -m pip check

      - name: Build C++ in Release mode
        run: |
          cmake -S . -B build/cpp -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DMERIDIAN_TEST_PYTHON=
          cmake --build build/cpp --parallel 2

      - name: Run native C++ tests
        run: ctest --test-dir build/cpp --output-on-failure --no-tests=error

      - name: Run Python tests with C++ integration enabled
        env:
          MERIDIAN_CPP_BINARY: ${{ github.workspace }}/build/cpp/meridian_ekf_replay
        run: python -m pytest -q -ra

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Run web tests
        run: npm --prefix web test

      - name: Check recorded study export
        run: npm --prefix web run check:studies

      - name: Build web application
        run: npm --prefix web run build
