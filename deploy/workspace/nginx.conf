worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 8k;
    client_body_timeout 15s;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    upstream meridian_api {
        zone meridian_api 64k;
        server api:8000 resolve;
    }
    # The production port is reachable only through the trusted ingress network.
    # Reject ambiguous/combined forwarded values instead of reflecting them.
    map $http_x_forwarded_proto $meridian_scheme { default http; https https; }
    map $meridian_scheme $meridian_hsts { default ""; https "max-age=3600"; }
    log_format minimal '$remote_addr "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout minimal;
    server { listen 8080 default_server; server_name _; return 444; }
    server {
        listen 8080;
        server_name ${MERIDIAN_DOMAIN} 127.0.0.1;
        root /usr/share/nginx/html;
        include /etc/nginx/security-headers.conf;

        location = /healthz { access_log off; try_files /workspace.html =503; }
        location = / { try_files /workspace.html =404; add_header Cache-Control "no-cache"; include /etc/nginx/security-headers.conf; }
        location ~ \.html$ { try_files $uri =404; add_header Cache-Control "no-cache"; include /etc/nginx/security-headers.conf; }
        location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; include /etc/nginx/security-headers.conf; }
        # Only binary upload chunks have a larger body budget. Buffer the bounded
        # request before entering the database-backed mutation; slow transfers
        # must not hold the shared queue lock while waiting on the browser.
        location ~ ^/api/v1/projects/[0-9a-f-]+/acquisitions/[0-9a-f-]+/content$ {
            client_max_body_size 4m;
            proxy_request_buffering on;
            proxy_pass http://meridian_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $meridian_scheme;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 35s;
            proxy_send_timeout 15s;
            proxy_buffering off;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
        }
        location /api/ {
            proxy_pass http://meridian_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $meridian_scheme;
            # Authentication budgets intentionally use the private ingress peer.
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 35s;
            proxy_send_timeout 15s;
            proxy_buffering off;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
        }
        location ~ /\. { return 404; }
        location / { try_files $uri =404; }
    }
}
